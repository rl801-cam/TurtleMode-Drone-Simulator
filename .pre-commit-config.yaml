# Hooks for prek (`uvx prek run --all-files`) and classic pre-commit.
# Install both hook types with `uvx prek install` (or `pre-commit install`).
# Every repo is pinned to a released tag.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Third-party code is kept byte-identical to upstream.
exclude: ^(vendor/|bench/splat/vendor/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^assets/
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^assets/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      # Binary assets (HDRIs, baked worlds) are committed on purpose and the
      # largest is ~7 MB; anything bigger belongs in a fetch script.
      - id: check-added-large-files
        args: [--maxkb=8192]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
