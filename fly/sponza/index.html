<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TurtleMode: Sponza (WebGPU)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #fff; }
        canvas { display: block; }
        #hud { position: fixed; left: 10px; top: 8px; white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
        #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.55); white-space: pre-line; }
        #msg.hidden { display: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "../../vendor/three-r187/three.webgpu.js",
                "three/webgpu": "../../vendor/three-r187/three.webgpu.js",
                "three/tsl": "../../vendor/three-r187/three.tsl.js",
                "three/addons/": "../../vendor/three-r187/addons/",
                "cannon-es": "../../vendor/cannon-es/cannon-es.js",
                "three-mesh-bvh": "../../vendor/three-mesh-bvh/index.module.js"
            }
        }
    </script>
</head>
<body>
<div id="hud"></div>
<div id="msg">Loading…</div>
<script type="module">
// Sponza atrium, flown as a tiny whoop, WebGPU only (three r187).
//
// Look: the three.js lightprobes_sponza example - a physical SunLight with cascaded shadows, a
// SkyMesh sky, and a LightProbeGrid baked from the scene at load so light bounced off the sunlit
// courtyard floor and walls fills the galleries. Flight: the simulator's own PhysicsEngine and
// InputHandler (js/physics.js, js/input.js), with a whoop preset; collision against a BVH of the
// whole model through the same callbacks the main simulator uses.
//
// URL: q=low|med|high (quality preset), scale (render scale, overrides preset), probes=0,
// shadows=0, bounces, cam=fpv|chase, uptilt (deg), fov (deg), sun=azimuth,elevation,
// mode=fly|bench (bench: scripted path, publishes window.benchResult for tools/bench).
import * as THREE from 'three/webgpu';
import { pass, mrt, output, velocity } from 'three/tsl';
import { traa } from 'three/addons/tsl/display/TRAANode.js';
import { taau } from 'three/addons/tsl/display/TAAUNode.js';
import { smaa } from 'three/addons/tsl/display/SMAANode.js';
import { fxaa } from 'three/addons/tsl/display/FXAANode.js';
import { fsr1 } from 'three/addons/tsl/display/FSR1Node.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DDSLoader } from 'three/addons/loaders/DDSLoader.js';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import { SunLight } from 'three/addons/lights/SunLight.js';
import { SunLightNode } from 'three/addons/lights/SunLightNode.js';
import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { PhysicsEngine } from '../../js/physics.js?v=36';
import { InputHandler } from '../../js/input.js?v=36';
import * as CANNON from 'cannon-es';
import { PilotUI } from './controls.js';
import { AudioEngine } from '../../js/audio.js?v=36';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const q = new URLSearchParams(location.search);
const msg = document.getElementById('msg'), hud = document.getElementById('hud');
// Measured on the target laptop (Iris Plus G7, 1920x1200, vsync on, sustained): rendering straight
// to the canvas with a depth pre-pass and letting the compositor upscale beats the post chain
// (TRAA / FSR1 / TAAU each cost several ms per full-screen pass here): med 58 fps vs 31 with TRAA.
const PRESETS = {
    low:  { scale: 0.67, shadow: 2048, msaa: false, probes: [8, 5, 5],  cube: 16, post: 0, zpre: '1' },
    med:  { scale: 0.8,  shadow: 2048, msaa: true,  probes: [10, 7, 7], cube: 32, post: 0, zpre: '1' },
    high: { scale: 1.0,  shadow: 4096, msaa: true,  probes: [14, 8, 8], cube: 32, post: 0, zpre: '1' },
};
const preset = { ...PRESETS[q.get('q') || 'med'] };
if (q.get('scale')) preset.scale = Number(q.get('scale'));
if (q.get('taa')) preset.taa = q.get('taa') === '1';

if (!navigator.gpu) { msg.textContent = 'This map needs WebGPU.\nBrave on Linux: start it with\n--enable-unsafe-webgpu --enable-features=Vulkan'; throw new Error('no WebGPU'); }

const renderer = new THREE.WebGPURenderer({ antialias: q.get('msaa') != null ? q.get('msaa') === '1' : preset.msaa, powerPreference: 'high-performance', trackTimestamp: (q.get('mode') === 'bench' && q.get('ts') !== '0') || q.get('gpuTime') === '1' });
renderer.setPixelRatio(1);
// Bench: render at exactly ?w x ?h whatever the window is (so runs are comparable).
const W = () => Number(q.get('w') || innerWidth), H = () => Number(q.get('h') || innerHeight);
renderer.setSize(W(), H(), !q.get('w'));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = Number(q.get('exposure') || 1.0);
renderer.shadowMap.enabled = q.get('shadows') !== '0';
document.body.prepend(renderer.domElement);
await renderer.init();
if (!renderer.backend.isWebGPUBackend) { msg.textContent = 'WebGPU adapter not available (fell back to WebGL).'; throw new Error('no WebGPU backend'); }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 85), W() / H(), 0.01, 400);

const sky = new SkyMesh();
sky.scale.setScalar(450000);
sky.turbidity.value = 10; sky.rayleigh.value = 2; sky.mieCoefficient.value = 0.005; sky.mieDirectionalG.value = 0.8;
if (sky.cloudSpeed) sky.cloudSpeed.value = 0;
if (sky.showSunDisc) sky.showSunDisc.value = false;
scene.add(sky);

// --- Model ---
const t0 = performance.now();
const LOCAL = '../../assets/models/sponza/Sponza.gltf';
const REMOTE = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf';
const manager = new THREE.LoadingManager();
manager.onProgress = (u, a, b) => { msg.textContent = `Loading Sponza… ${a}/${b}`; };
const loader = new GLTFLoader(manager);
const haveLocal = (await fetch(LOCAL, { method: 'HEAD' }).catch(() => null))?.ok;
// GPU-compressed textures (tools/assets/dds_encode.py -> assets/models/sponza/dds/): each glTF
// texture is swapped for its DXT1/DXT5 .dds at load, before anything reaches the GPU. ~50 MB of
// texture memory instead of ~380 MB, and far less bandwidth per sample. dds=0 to compare.
const useDDS = haveLocal && q.get('dds') !== '0' && renderer.hasFeature?.('texture-compression-bc')
    && (await fetch('../../assets/models/sponza/dds/5823059166183034438.dds', { method: 'HEAD' }).catch(() => null))?.ok;
const aniso = Number(q.get('aniso') || 4);
if (useDDS) {
    const dds = new DDSLoader(manager);
    const WRAP = { 33071: THREE.ClampToEdgeWrapping, 33648: THREE.MirroredRepeatWrapping, 10497: THREE.RepeatWrapping };
    loader.register((parser) => ({
        name: 'dds-swap',
        loadTexture(i) {
            const json = parser.json, td = json.textures[i], uri = json.images[td.source]?.uri;
            if (!uri) return null;
            return dds.loadAsync('../../assets/models/sponza/dds/' + uri.replace(/\.\w+$/, '.dds')).then((t) => {
                const sm = json.samplers?.[td.sampler] || {};
                t.flipY = false;
                t.wrapS = WRAP[sm.wrapS ?? 10497]; t.wrapT = WRAP[sm.wrapT ?? 10497];
                t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
                t.anisotropy = aniso;
                parser.associations.set(t, { textures: i });
                return t;
            });
        },
    }));
}
const gltf = await loader.loadAsync(haveLocal ? LOCAL : REMOTE);
const model = gltf.scene;
const lights = [];
model.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } else if (o.isLight) lights.push(o); });
lights.forEach((l) => l.parent?.remove(l));
scene.add(model);
model.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());

// --- Sun ---
const [sunAz, sunEl] = (q.get('sun') || '-75,60').split(',').map(Number);
// One directional light whose shadow map is fitted tightly round the atrium and rendered once:
// the building and the sun never move, so cascades re-rendered every frame (the example's
// SunLight) only cost time - they were the frame-time spikes. The whoop casts no shadow.
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, Math.PI / 2 - THREE.MathUtils.degToRad(sunEl), THREE.MathUtils.degToRad(sunAz));
const sun = new THREE.DirectionalLight(0xfff2dc, Number(q.get('sunI') || 100));
const centre = box.getCenter(new THREE.Vector3());
sun.position.copy(centre).addScaledVector(sunDir, 60); sun.target.position.copy(centre);
scene.add(sun, sun.target);
sky.sunPosition.value.copy(sunDir);
sun.castShadow = renderer.shadowMap.enabled;
if (sun.castShadow) {
    const sc = sun.shadow.camera, M = new THREE.Matrix4().lookAt(sun.position, centre, new THREE.Vector3(0, 1, 0)).setPosition(sun.position).invert();
    const fit = new THREE.Box3();
    for (let i = 0; i < 8; i++) fit.expandByPoint(new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(M));
    sc.left = fit.min.x; sc.right = fit.max.x; sc.bottom = fit.min.y; sc.top = fit.max.y; sc.near = -fit.max.z - 1; sc.far = -fit.min.z + 1;
    sc.updateProjectionMatrix();
    sun.shadow.mapSize.setScalar(preset.shadow);
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    sun.shadow.autoUpdate = false; sun.shadow.needsUpdate = true;
}

// --- Collision: one BVH over the whole model (every surface is solid) ---
msg.textContent = 'Building collision…';
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
// Sponza's materials by index (glTF order): 14-19 are the hanging curtains and banners, 0 and 3
// the ivy and potted plants. Those aren't solid: cloth snags the whoop (see `snag` below) and
// leaves only drag on it. Everything else is a hard surface.
const CLOTH = new Set([14, 15, 16, 17, 18, 19]), PLANT = new Set([0, 3]);
const matIndex = (m) => gltf.parser.associations.get(m)?.materials;
const geoms = [], clothG = [], plantG = [];
model.traverse((o) => {
    if (!o.isMesh || !o.geometry.attributes.position) return;
    const mi = matIndex(o.material), list = CLOTH.has(mi) ? clothG : PLANT.has(mi) ? plantG : geoms;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', o.geometry.attributes.position.clone());
    if (o.geometry.index) g.setIndex(o.geometry.index.clone());
    g.applyMatrix4(o.matrixWorld);
    list.push(g);
});
const softBVH = (list) => { if (!list.length) return null; const m = BufferGeometryUtils.mergeGeometries(list); m.computeBoundsTree(); return m.boundsTree; };
const clothBVH = softBVH(clothG), plantBVH = softBVH(plantG);
const collGeom = BufferGeometryUtils.mergeGeometries(geoms);
geoms.forEach((g) => g.dispose());
const tb = performance.now();
collGeom.computeBoundsTree();
const bvhMs = Math.round(performance.now() - tb);
const bvh = collGeom.boundsTree;
const _p = new THREE.Vector3(), _t = {}, _ray = new THREE.Ray(), _d = new THREE.Vector3();
const hit = { closestPoint: new THREE.Vector3(), dist: 0, depth: 0, normal: new THREE.Vector3() };
const sweepHit = { point: new THREE.Vector3(), normal: new THREE.Vector3(), distance: 0 };
function checkCollision(pos, radius) {
    _p.set(pos.x, pos.y, pos.z);
    const r = bvh.closestPointToPoint(_p, _t, 0, radius);
    if (!r || r.distance >= radius) return null;
    hit.closestPoint.copy(r.point); hit.dist = r.distance; hit.depth = radius - r.distance;
    hit.normal.subVectors(_p, r.point);
    if (hit.normal.lengthSq() > 1e-8) hit.normal.normalize(); else hit.normal.set(0, 1, 0);
    return hit;
}
function sweep(from, to) {
    _ray.origin.set(from.x, from.y, from.z);
    _d.set(to.x - from.x, to.y - from.y, to.z - from.z);
    const travel = _d.length(); if (travel < 1e-6) return null;
    _ray.direction.copy(_d.multiplyScalar(1 / travel));
    const h = bvh.raycastFirst(_ray, THREE.DoubleSide);
    if (!h || h.distance > travel) return null;
    sweepHit.point.copy(h.point); sweepHit.distance = h.distance;
    if (h.face?.normal) { sweepHit.normal.copy(h.face.normal); if (sweepHit.normal.dot(_ray.direction) > 0) sweepHit.normal.negate(); }
    else sweepHit.normal.copy(_ray.direction).negate();
    return sweepHit;
}

// --- Bounce light: probe grid baked from the scene (bounds from the three.js example) ---
let probeMs = 0;
if (q.get('probes') !== '0') {
    msg.textContent = 'Baking bounce light…';
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const [nx, ny, nz] = preset.probes;
    const probes = new LightProbeGrid(23.3, 12.8, 10.5, nx, ny, nz);
    probes.position.set(-0.5, 6, -0.3);
    scene.add(probes);
    const tp = performance.now(), total = nx * ny * nz, bounces = Number(q.get('bounces') ?? 1);
    for (let p = 0; p <= bounces; p++)
        for (let s = 0; s < total; s += 16)
            probes.bake(renderer, scene, { cubemapSize: preset.cube, near: 0.05, far: Math.max(size.x, size.y, size.z) * 2, start: s, count: Math.min(16, total - s), pass: p });
    await renderer.backend.device?.queue.onSubmittedWorkDone?.();
    probeMs = Math.round(performance.now() - tp);
}

// --- Drone: the simulator's physics, scaled to a 1S tiny whoop (~32 g, 65 mm, ducted) ---
const physics = new PhysicsEngine();
physics.updateConfig({ mass: 0.032, thrustCurve: 0.5, restitution: 0.3, friction: 0.35 });
// Flight settings (sliders in the M panel; tiny-whoop defaults in controls.js).
function applySettings(st) {
    physics.updateConfig({ thrust: 0.032 * 9.81 * st.twr, propPitchSpeed: st.speed,
        rates: { roll: { center: st.center, max: st.rate, expo: st.expo }, pitch: { center: st.center, max: st.rate, expo: st.expo }, yaw: { center: st.center, max: st.yawRate, expo: st.expo } } });
    if (st.uptilt !== uptilt) { uptilt = st.uptilt; mountCamera?.(); }
}
physics.dragAreas = { x: 0.0011, y: 0.0035, z: 0.001 };
physics.rotorDrag = 0.45 * (0.032 / 0.5);
// Ducts: contact spheres at the four duct centres plus the middle, coplanar with the CoM.
const a = 0.032, r = 0.024;
// Five points, as the solver's scratch arrays expect: the four ducts, and the fifth just ahead of
// centre where the camera sits, so it can't poke through a wall.
physics.contactPoints = [[-a, -a], [a, -a], [-a, a], [a, a], [0, -0.03]].map(([x, z]) => ({ offset: new CANNON.Vec3(x, 0, z), radius: r }));
physics.broadPhaseRadius = 0.09;
physics.collisionCallback = checkCollision;
physics.sweepCallback = sweep;
const spawn = (q.get('spawn') || '0,0.15,0,90').split(',').map(Number);
// Spawn on whatever floor is under (x, z): the model's bounding box reaches below the floor.
const floorY = (() => { _ray.origin.set(spawn[0], box.max.y - 0.5, spawn[2]); _ray.direction.set(0, -1, 0); const h = bvh.raycastFirst(_ray, THREE.DoubleSide); return h ? h.point.y : 0; })();
physics.setSpawn(spawn[0], floorY + spawn[1], spawn[2], spawn[3]);
physics.reset();
const input = new InputHandler();
let uptilt = 15, mountCamera = null;

// Camera: FPV on the airframe (uptilt like a whoop cam), or a chase view (C toggles).
const rig = new THREE.Object3D(); scene.add(rig);
const pod = new THREE.Object3D(); pod.position.set(0, 0.012, -0.02); rig.add(pod);
let camMode = q.get('cam') || 'fpv';
mountCamera = function () {
    if (camMode === 'fpv') { pod.add(camera); camera.position.set(0, 0, 0); camera.rotation.set(THREE.MathUtils.degToRad(uptilt), 0, 0); }
    else scene.add(camera);
};
// Reset: back to the spawn, disarmed-safe (it stays armed if the switch is armed, like a real
// sim's "respawn"), and out of any snag.
function resetDrone() { physics.reset(); snag.t = 0; snag.hold = null; }
const ui = new PilotUI({ input, onReset: resetDrone, onSettings: applySettings });
// Motor sound: the main sim's synth, retuned for a whoop (tiny 0802 motors spin 25-40k rpm with
// 4-blade 31 mm props: a whine an octave and more above a 5-inch quad). Browsers only start audio
// after a click or key press, so the first one starts it.
const audio = new AudioEngine();
Object.assign(audio, { minFrequency: 170, maxFrequency: 640, bladeCount: 4, maxToneGain: 0.02, airReferenceSpeed: 12 });
const startAudio = () => { if (!audio.ctx) audio.start(); };
addEventListener('pointerdown', startAudio); addEventListener('keydown', startAudio);
applySettings(ui.set);
mountCamera();
const whoop = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.006, 6, 16).rotateX(Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: 0x222222, roughness: 0.6 }));
const whoopG = new THREE.Group();
for (const [x, z] of [[-a, -a], [a, -a], [-a, a], [a, a]]) { const m = whoop.clone(); m.position.set(x, 0, z); whoopG.add(m); }
whoopG.add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.015, 0.05), new THREE.MeshStandardNodeMaterial({ color: 0xd04020, roughness: 0.5 })));
whoopG.traverse((o) => { if (o.isMesh) o.castShadow = true; });
scene.add(whoopG);
whoopG.visible = camMode !== 'fpv';
addEventListener('keydown', (e) => {
    if (e.code === 'KeyC') { camMode = camMode === 'fpv' ? 'chase' : 'fpv'; whoopG.visible = camMode !== 'fpv'; mountCamera(); }
});

// --- Post: scene pass, temporal AA at a reduced render scale (upscaled by TRAA's resolve) ---
const post = new THREE.RenderPipeline(renderer);
let scenePass;
function setupPost() {
    scenePass = pass(scene, camera);
    // aa: taa (TRAA at the render scale), taau (temporal upscaling from the render scale to full
    // resolution in one pass), smaa, fxaa, none.
    const aa = q.get('aa') || preset.aa || (preset.taa ? 'taa' : 'none');
    if (aa === 'taa' || aa === 'taau') {
        scenePass.setMRT(mrt({ output, velocity }));
        post.outputNode = (aa === 'taau' ? taau : traa)(scenePass.getTextureNode('output'), scenePass.getTextureNode('depth'), scenePass.getTextureNode('velocity'), camera);
    } else if (aa === 'smaa') post.outputNode = smaa(scenePass);
    else if (aa === 'fxaa') post.outputNode = fxaa(scenePass);
    else post.outputNode = scenePass;
    // Below full resolution, upscale with FSR1 (edge-adaptive upsample + sharpening) rather than a
    // bilinear stretch - except after TAAU, which upscales itself.
    const up = q.get('up') || preset.up || 'fsr';
    if (preset.scale < 1 && aa !== 'taau' && up === 'fsr') post.outputNode = fsr1(post.outputNode, Number(q.get('sharp') ?? 0.25));
    window.aaMode = aa + (preset.scale < 1 && aa !== 'taau' && up === 'fsr' ? '+fsr' : '');
    scenePass.setResolutionScale?.(preset.scale);
    post.needsUpdate = true;
}
// post=0: no post chain at all. Render straight to a canvas of scale x the window and let the
// browser's compositor stretch it (free); tone mapping happens inline in the materials.
const DIRECT = (q.get('post') ?? preset.post) === '0' || (q.get('post') ?? preset.post) === 0;
if (DIRECT) {
    renderer.setPixelRatio(preset.scale);
    renderer.setSize(W(), H(), true);
    window.aaMode = 'direct';
} else setupPost();
// zpre=1: depth pre-pass (direct mode). Sponza is a few huge draw calls, so front-to-back sorting
// can't stop the heavy PBR shader running on pixels that end up hidden; laying down depth first
// with a trivial shader, then shading with depthFunc <= and no depth writes, shades each pixel
// once. Alpha-tested materials (leaves, chains) skip the pre-pass and draw normally.
const ZPRE = DIRECT && (q.get('zpre') ?? preset.zpre ?? '0') === '1';
const depthOnly = new THREE.MeshBasicNodeMaterial({ colorWrite: false });
const maskMeshes = [], opaqueMats = new Set();
model.traverse((o) => { if (o.isMesh) { if (o.material.alphaTest > 0 || o.material.transparent) maskMeshes.push(o); else opaqueMats.add(o.material); } });
if (ZPRE) for (const m of opaqueMats) { m.depthFunc = THREE.LessEqualDepth; m.depthWrite = false; }
function drawDirect() {
    if (!ZPRE) return renderer.render(scene, camera);
    const vis = [sky.visible, whoopG.visible];
    sky.visible = false; whoopG.visible = false; maskMeshes.forEach((m) => (m.visible = false));
    scene.overrideMaterial = depthOnly;
    renderer.render(scene, camera);
    scene.overrideMaterial = null; [sky.visible, whoopG.visible] = vis; maskMeshes.forEach((m) => (m.visible = true));
    renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true;
}
const draw = () => (DIRECT ? drawDirect() : post.render());
addEventListener('resize', () => { if (q.get('w')) return; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

msg.classList.add('hidden');
const loadMs = Math.round(performance.now() - t0);
const chase = new THREE.Vector3(), look = new THREE.Vector3(), fwd = new THREE.Vector3();
function syncCamera(dt) {
    const s = physics.getDroneState();
    rig.position.copy(s.position); rig.quaternion.copy(s.quaternion);
    whoopG.position.copy(s.position); whoopG.quaternion.copy(s.quaternion);
    if (camMode === 'chase') {
        fwd.set(0, 0, -1).applyQuaternion(rig.quaternion); fwd.y = 0; fwd.normalize();
        chase.copy(rig.position).addScaledVector(fwd, -0.45).add({ x: 0, y: 0.15, z: 0 });
        camera.position.lerp(chase, 1 - Math.exp(-dt / 0.08));
        camera.lookAt(look.copy(rig.position).addScaledVector(fwd, 0.3));
    }
}

// --- Cloth and leaves ---
// Flying into a curtain or banner: the fabric wraps the ducts. Any contact drags hard on the
// airframe (velocity and spin decay in ~0.1 s) and loads the props; a hit faster than 2.5 m/s, or
// staying in it for 0.4 s, is a tangle: the whoop hangs in the cloth, props stalled, and resets
// after a second. Leaves only drag (~0.35 s), and a little.
const snag = { t: 0, hold: null, msgUntil: 0 }; let snagCount = 0;
const _sp = new THREE.Vector3(), _st = {};
function touching(tree, p, r) { if (!tree) return false; _sp.set(p.x, p.y, p.z); const h = tree.closestPointToPoint(_sp, _st, 0, r); return !!h && h.distance < r; }
function updateSnag(dt, now) {
    const b = physics.droneBody, p = b.position;
    if (snag.hold) {
        b.position.copy(snag.hold.pos); b.velocity.set(0, 0, 0); b.angularVelocity.scale(Math.exp(-dt / 0.05), b.angularVelocity);
        if (now > snag.hold.until) { resetDrone(); snag.msgUntil = now + 800; }
        return;
    }
    if (touching(clothBVH, p, 0.06)) {
        const speed = b.velocity.length();
        if (snag.t === 0 && speed > 2.5 || snag.t > 0.4) { snagCount++; snag.hold = { pos: p.clone(), until: now + 1100 }; return; }
        snag.t += dt;
        const k = Math.exp(-dt / 0.1);
        b.velocity.scale(k, b.velocity); b.angularVelocity.scale(k, b.angularVelocity);
    } else snag.t = Math.max(0, snag.t - dt * 2);
    if (touching(plantBVH, p, 0.06)) {
        const k = Math.exp(-dt / 0.35);
        b.velocity.scale(k, b.velocity);
    }
}

// --- Loop ---
let lastArmed = false;
let last = performance.now(), frames = 0, fpsT = last, fps = 0;
const frameTimes = [], gpuTimes = [];
const mode = q.get('mode') || 'fly';
if (mode === 'bench') {
    // Scripted: a fixed camera path round the atrium (no physics), to time rendering only.
    const N = Number(q.get('frames') || 240);
    const phase = Number(q.get('phase') || 0);
    const path = (t) => { const ang = (t + phase) * Math.PI * 2; return [Math.cos(ang) * 9, box.min.y + 1.2 + 4 * (0.5 - 0.5 * Math.cos(ang * 2)), Math.sin(ang) * 3.2]; };
    camMode = 'free'; scene.add(camera); camera.rotation.set(0, 0, 0);
    for (let i = 0; i < 30; i++) { draw(); await new Promise((r) => requestAnimationFrame(r)); }
    const tS = performance.now(); let prev = tS;
    for (let i = 0; i < N; i++) {
        const [x, y, z] = path(i / N), [x2, y2, z2] = path((i + 3) / N);
        camera.position.set(x, y, z); camera.lookAt(x2, y2, z2);
        draw();
        await new Promise((r) => requestAnimationFrame(r));
        const now = performance.now(); frameTimes.push(now - prev); prev = now;
        if (renderer.backend.trackTimestamp) { const g = await renderer.resolveTimestampsAsync('render'); if (g) gpuTimes.push(g); }
    }
    gpuTimes.sort((x, y) => x - y);
    const gpu = gpuTimes.length ? { gpuP50: +gpuTimes[gpuTimes.length >> 1].toFixed(2), gpuP90: +gpuTimes[Math.floor(gpuTimes.length * 0.9)].toFixed(2), gpuN: gpuTimes.length } : { gpuN: 0 };
    const spikes = frameTimes.map((t, i) => [i, Math.round(t)]).filter(([, t]) => t > 40);
    frameTimes.sort((x, y) => x - y);
    const avg = (performance.now() - tS) / N;
    window.benchResult = { preset: q.get('q') || 'med', aa: window.aaMode, ...gpu, scale: preset.scale, w: renderer.domElement.width, h: renderer.domElement.height, fps: Math.round(1000 / avg * 10) / 10, p50: frameTimes[N >> 1].toFixed(1), p95: frameTimes[Math.floor(N * 0.95)].toFixed(1), loadMs, bvhMs, probeMs, dds: !!useDDS, spikes: spikes.slice(0, 30), nSpikes: spikes.length, adapter: renderer.backend.adapter?.info?.description || renderer.backend.adapter?.info?.vendor || '' };
    hud.textContent = JSON.stringify(window.benchResult);
} else {
    const auto = mode === 'flytest', track = []; let contacts = 0; const autoT0 = performance.now();
    // Hover throttle for this airframe, from the thrust curve (thrust = T * mix(t, t^2, curve)).
    const hoverT = (() => { const tw = 1 / ui.set.twr, c = physics.params.thrustCurve; let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; ((1 - c) * m + c * m * m < tw) ? lo = m : hi = m; } return lo; })();
    renderer.setAnimationLoop(() => {
        const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
        let { axes, armed } = ui.update();
        if (snag.hold) axes = { ...axes, throttle: 0 };
        if (auto) {
            // Scripted test flight (mode=flytest): climb, hover, fly forward into the far wall.
            const t = (now - autoT0) / 1000;
            armed = t > 0.3;
            const climb = Number(q.get('climb') || 1.2);
            axes = { throttle: t < climb ? 0.75 : t < 2.5 ? hoverT : hoverT + 0.06, yaw: 0, pitch: t > 2.5 ? -0.18 : 0, roll: 0 };
            const p = physics.droneBody.position;
            track.push([+t.toFixed(2), +p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]);
            if (physics._inContact) contacts++;
            if (t > Number(q.get('tEnd') || 9) && !window.benchResult) {
                const inside = box.containsPoint(new THREE.Vector3(p.x, p.y, p.z));
                const cb = clothG.length ? new THREE.Box3().setFromBufferAttribute(BufferGeometryUtils.mergeGeometries(clothG).attributes.position) : null;
                window.benchResult = { mode: 'flytest', inside, contacts, snagged: snagCount, cloth: cb && [cb.min.toArray().map((v) => +v.toFixed(1)), cb.max.toArray().map((v) => +v.toFixed(1))], maxY: Math.max(...track.map((r) => r[2])).toFixed(2), path: track.filter((_, i) => i % 30 === 0) };
            }
        }
        physics.setInputs(axes, armed); lastArmed = armed;
        physics.step(dt);
        updateSnag(dt, now);
        syncCamera(dt);
        if (audio.ctx) audio.update(axes, armed && !snag.hold, physics.droneBody.velocity.length(), camMode === 'fpv' ? 0 : 0.5);
        draw();
        frames++;
        if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
        const v = physics.droneBody.velocity.length();
        hud.textContent = `${fps} fps  ${q.get('q') || 'med'} x${preset.scale}  ${(v * 3.6).toFixed(0)} km/h  tilt ${uptilt}°\nM setup · Space reset · ↑↓ tilt · C camera${audio.ctx ? '' : ' · click for sound'}`;
        ui.setStatus(snag.hold ? '<span class="warn">TANGLED IN CLOTH</span>' : now < snag.msgUntil ? '<span class="warn">RESET</span>'
            : lastArmed ? '<span class="armed">ARMED</span>' : '<span class="disarmed">DISARMED</span>');
    });
    window.sim = { renderer, scene, camera, physics, input, post, sun, ui, snag };
}
</script>
