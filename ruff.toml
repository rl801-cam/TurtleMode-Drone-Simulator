# Lint and format the Python tooling (tools/, bench/). Scripts only, no
# package; third-party code under vendor/ is left alone.
target-version = "py310"
line-length = 100
extend-exclude = ["vendor", "bench/splat/vendor"]

[lint]
# pycodestyle errors and warnings, pyflakes, import order, pyupgrade,
# bugbear, simplify, comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
# A one-line lambda bound to a name reads fine as a small local helper.
ignore = ["E731"]

[format]
quote-style = "preserve"
