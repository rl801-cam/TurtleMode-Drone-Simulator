# Lint and format the Python tooling (tools/, bench/). Scripts only, no
# package; third-party code under vendor/ is left alone.
target-version = "py310"
line-length = 100
extend-exclude = ["vendor", "bench/splat/vendor"]

[lint]
# pyflakes, pycodestyle errors, import order, pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# Not auto-fixable, and the dense numeric scripts use them on purpose.
ignore = ["E731", "E741", "UP031"]

[format]
quote-style = "preserve"
